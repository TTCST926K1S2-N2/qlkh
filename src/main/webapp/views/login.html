<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - Quản Lý Khách Hàng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Đường dẫn tương đối từ views/ sang assets/css/ -->
  <link rel="stylesheet" href="../assets/css/login.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h2 class="title">Đăng Nhập</h2>
        <p class="subtitle">Hệ Thống Quản Lý Khách Hàng</p>
      </div>

      <!-- Khung thông báo lỗi / thành công -->
      <div id="alert-message" class="alert-box"></div>

      <form id="login-form" class="login-form" novalidate>
        <div class="form-group">
          <label for="username">Tên đăng nhập hoặc Email</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Nhập tên đăng nhập hoặc email" 
            required 
          />
          <span class="field-error" id="username-error"></span>
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Nhập mật khẩu" 
              required 
            />
            <button type="button" id="btn-toggle-password" class="btn-toggle-eye" aria-label="Hiện mật khẩu">👁️</button>
          </div>
          <span class="field-error" id="password-error"></span>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember-me" name="remember" />
            <span>Ghi nhớ đăng nhập</span>
          </label>
          <a href="./reset-password.html" class="forgot-link">Quên mật khẩu?</a>
        </div>

        <button type="submit" id="btn-submit" class="btn-login">Đăng Nhập</button>
      </form>
    </div>
  </div>

  <!-- Đường dẫn tương đối sang assets/js/ -->
  <script src="../assets/js/login.js"></script>
</body>
</html>
